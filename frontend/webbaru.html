  q = (q || '').trim();
  const out = $('#sOut'); if (!out) return;

  const row = a => `<button class="srow" data-action="s-open" data-id="${esc(a.id)}">
    <img loading="lazy" src="${esc(cover(a))}" alt=""${fallback(a)}>
    <span class="srt">${esc(a.title)}</span>
    <span class="srm">${a.rating ? a.rating.toFixed(1) + ' · ' : ''}${a.eps ? a.eps + ' EP' : 'ANIME'}${a.genres[0] ? ' · ' + esc(a.genres[0]).toUpperCase() : ''}</span>
    <i data-lucide="arrow-up-right"></i></button>`;

  if (!q) {
    if (!state.top.length && !state.ongoing.length) {
      try { const d = await api('/api/ongoing'); state.ongoing = memoS(d.items); } catch (e) {}
      if (tok !== SR_TOK) return;
    }
    const tr = (state.top.length ? state.top : state.ongoing).slice(0, 6);
    out.innerHTML = tr.length ? `<p class="slabel">POPULER</p>` + tr.map(row).join('')
      : `<p class="slabel">MULAI MENGETIK UNTUK MENCARI</p>`;
    icons(); lazyThumbs(out); return;
  }

  out.innerHTML = `<p class="slabel">MENCARI…</p>`;
  let res = [];
  try { const d = await api('/api/search?q=' + encodeURIComponent(q)); res = memoS(d.results || d.items || []); } catch (e) {}
  if (tok !== SR_TOK) return;
  out.innerHTML = res.length
    ? `<p class="slabel">${res.length} HASIL UNTUK “${esc(q.toUpperCase())}”</p>` + res.map(row).join('')
    : `<div class="sempty"><span class="eic"><i data-lucide="search"></i></span>
       <h3>Tak ada hasil untuk “${esc(q)}”</h3>
       <p>Coba kata kunci lain, misalnya judul lain atau istilah yang lebih pendek.</p></div>`;
  icons();
  lazyThumbs(out);
}

/* ----------------------------------------------------------------
   MANGA (katalog, detail, pembaca)
   Endpoint: /api/manga/list /genres /detail /chapter
   Sumber manga belum dikonfigurasi -> UI menampilkan status "belum
   tersambung" sampai manga.py diisi.
   ---------------------------------------------------------------- */
const mcover = m => m.thumb || phImg(m.title);
const mfb = m => ` onerror="this.onerror=null;this.src='${phImg(m.title)}'"`;
/* placeholder halaman reader bila gambar relay gagal dimuat */
const rph = i => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">' +
  '<rect width="800" height="1200" fill="#0f0f13"/>' +
  '<text x="400" y="600" fill="#3a3a45" font-family="sans-serif" font-size="34" ' +
  'text-anchor="middle">HALAMAN ' + (i + 1) + '</text></svg>');

async function renderManga() {
  $('#view-manga').innerHTML = `<section class="wrap">
    <div class="ph"><span class="sidx">(MANGA 18+)</span><h1 class="ph-t">Manga <span class="age18 big">18+</span></h1><p class="ph-s" id="mStat">MEMUAT</p></div>
    <a class="yomu-cta" href="/manga" aria-label="Buka reader YOMU">
      <i data-lucide="book-open"></i>
      <span>Buka <b>YOMU</b> <span class="age18">18+</span> — reader manga dewasa, layar penuh</span>
      <i data-lucide="arrow-right" class="arr"></i></a>
    <a class="shiro-cta" href="/shiro" aria-label="Buka SHIRO (manga biasa)">
      <i data-lucide="book-marked"></i>
      <span>Buka <b>SHIRO</b> — katalog manga biasa, lengkap per chapter</span>
      <i data-lucide="arrow-right" class="arr"></i></a>
    <div class="msearch"><i data-lucide="search"></i>
      <input id="mIn" type="text" placeholder="Cari manga…" autocomplete="off" spellcheck="false"></div>
    <div class="mgenres" id="mGenres"></div>
    <div class="bgrid" id="mGrid"><div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div></div>
    <div class="loadmore" id="mMore"></div>
  </section>`;
  const inp = $('#mIn');
  inp.addEventListener('input', () => {
    clearTimeout(state.manga.t);
    state.manga.t = setTimeout(() => loadManga(1, inp.value.trim()), 300);
  });
  state.manga.genres = [];
  try { const g = await api('/api/manga/genres'); state.manga.genres = g.genres || []; } catch (e) {}
  drawMangaGenres();
  loadManga(1, '');
}

function drawMangaGenres() {
  const el = $('#mGenres'); if (!el) return;
  const gs = state.manga.genres;
  el.innerHTML = gs.length
    ? `<button class="chip ${state.manga.genre ? '' : 'on'}" data-action="mgenre" data-slug="">Semua</button>`
      + gs.map(g => `<button class="chip ${state.manga.genre === g.slug ? 'on' : ''}" data-action="mgenre" data-slug="${esc(g.slug)}" data-g="${esc(g.name)}">${esc(g.name)}</button>`).join('')
    : '';
}

let M_TOK = 0;
async function loadManga(page, q) {
  const st = state.manga, tok = ++M_TOK;
  st.loading = true;
  const grid = $('#mGrid');
  if (page === 1 && grid) grid.innerHTML = '<div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div><div class="skl" style="height:250px"></div>';
  let data = { configured: false, items: [] };
  try {
    const u = '/api/manga/list?page=' + page
      + (q ? '&q=' + encodeURIComponent(q) : '')
      + (st.genre ? '&genre=' + encodeURIComponent(st.genre) : '');
    data = await api(u);
  } catch (e) {}
  st.loading = false;
  if (tok !== M_TOK || state.view !== 'manga') return;
  st.configured = !!data.configured;
  const items = data.items || [];
  st.items = page === 1 ? items : st.items.concat(items);
  st.page = page; st.max = data.max_page || 1;
  st.total = data.total != null ? data.total : st.items.length;
  drawManga();
}

function mcard(m, i) {
  const line = [m.latest ? 'CH ' + esc(m.latest) : null,
                m.status ? esc(String(m.status).toUpperCase()) : null,
                (m.genres && m.genres[0]) ? esc(m.genres[0]).toUpperCase() : null].filter(Boolean).join(' · ');
  return `<article class="pcard" data-action="open-manga" data-id="${esc(m.url)}" style="--i:${Math.min(i, 8)}">
    <div class="pm">
      <img class="pimg" loading="lazy" src="${esc(mcover(m))}" alt="${esc(m.title)}"${mfb(m)}>
      <span class="pbadge">${m.status ? esc(String(m.status).toUpperCase()) : 'MANGA'}</span>
    </div>
    <h3 class="pt">${esc(m.title)}</h3>
    <p class="pm2">${line || '&nbsp;'}</p>
  </article>`;
}

function drawManga() {
  const st = state.manga, grid = $('#mGrid'); if (!grid) return;
  const stat = $('#mStat'), more = $('#mMore');
  if (!st.configured) {
    grid.innerHTML = emptyBox('book-open', 'Bagian manga belum tersambung',
      'Sumber manga belum dikonfigurasi. Kirim situs manga-nya, lalu scraper-nya disambungkan ke halaman ini.');
    if (stat) stat.textContent = 'SUMBER BELUM DISET';
    if (more) more.innerHTML = '';
    icons(); return;
  }
  grid.innerHTML = st.items.length
    ? st.items.map((m, i) => mcard(m, i)).join('')
    : emptyBox('search', 'Tidak ada manga', 'Coba kata kunci atau genre lain.');
  if (stat) stat.textContent = `${st.items.length}${st.total > st.items.length ? ' / ' + st.total : ''} JUDUL`;
  if (more) more.innerHTML = (st.page < st.max)
    ? `<button class="btn" data-action="mloadmore"><i data-lucide="plus"></i>Muat Lebih Banyak</button>` : '';
  icons();
}

/* --- detail manga --- */
async function openManga(url) {
  if (!url) return;
  if (state.searchOpen) closeSearch();
  state.mangaId = url; syncLock();
  $('#mangaRoot').innerHTML = `<div class="ovl" data-action="close-manga-back"><div class="mback"></div>
    <div class="sheet" role="dialog" aria-modal="true"><button class="mx" data-action="close-manga" aria-label="Tutup"><i data-lucide="x"></i></button>
    <div class="eload"><span class="spin"></span> Memuat detail manga…</div></div></div>`;
  icons();
  let d = {};
  try { d = await api('/api/manga/detail?url=' + encodeURIComponent(url)); } catch (e) { d = {}; }
  if (state.mangaId !== url) return;
  $('#mangaRoot').innerHTML = mangaShell(d, url);
  icons();
}

function mangaShell(d, url) {
  if (!d || !d.manga) {
    const why = (d && d.configured === false)
      ? 'Sumber manga belum dikonfigurasi. Kirim situs manga-nya untuk menyambungkan.' : 'Gagal memuat detail manga ini.';
    return `<div class="ovl" data-action="close-manga-back"><div class="mback"></div>
      <div class="sheet" role="dialog"><button class="mx" data-action="close-manga" aria-label="Tutup"><i data-lucide="x"></i></button>
      ${emptyBox('book-open', 'Detail tidak tersedia', why)}</div></div>`;
  }
  const m = d.manga, chs = d.chapters || [];
  const chBlock = chs.length
    ? `<div class="eplist">${chs.map(c => `<button class="mch" data-action="open-chapter" data-url="${esc(c.url)}">
        <span class="cn"><i data-lucide="book-open"></i></span>
        <span class="ct">${esc(c.label || 'Chapter')}</span>
        <span class="cd">${esc(c.date || '')}</span></button>`).join('')}</div>`
    : `<div class="eload">Belum ada daftar chapter.</div>`;
  return `<div class="ovl" data-action="close-manga-back"><div class="mback"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
      <button class="mx" data-action="close-manga" aria-label="Tutup"><i data-lucide="x"></i></button>
      <div class="mhero">
        <div class="mp"><img src="${esc(mcover(m))}" alt="${esc(m.title)}"${mfb(m)}></div>
        <div>
          <span class="mkick">${esc(String(m.status || 'MANGA').toUpperCase())}${m.rating ? ' · ' + esc(m.rating) : ''}</span>
          <h2 class="mt">${esc(m.title)}</h2>
          ${(m.genres && m.genres.length) ? `<div class="mgens">${m.genres.map(g => `<span class="chip mini">${esc(g)}</span>`).join('')}</div>` : ''}
          <p class="mdesc">${esc(m.desc || 'Sinopsis belum tersedia untuk judul ini.')}</p>
          ${chs.length ? `<div class="mcta"><button class="btn btn-acc" data-action="open-chapter" data-url="${esc(chs[0].url)}"><i data-lucide="book-open"></i>Baca ${esc(chs[0].label || 'chapter terbaru')}</button></div>` : ''}
        </div>
      </div>
      <div class="meps">
        <div class="meps-h"><span class="sidx">(CHAPTER)</span><h3>Daftar Chapter</h3><span class="mcnt">${chs.length ? chs.length + ' TERSEDIA' : ''}</span></div>
        ${chBlock}
      </div>
    </div></div>`;
}

function closeManga() { state.mangaId = null; $('#mangaRoot').innerHTML = ''; syncLock(); }

/* --- pembaca chapter --- */
async function openChapter(url, fresh) {
  if (!url) return;
  if (state.mangaId) closeManga();
  state.reader = { url, prev: null, next: null };
  $('#readerRoot').innerHTML = `<div class="reader"><div class="rtop">
    <button class="ic" data-action="close-reader" aria-label="Tutup"><i data-lucide="x"></i></button>
    <span class="rt">Memuat…</span></div>
    <div class="rmsg"><span class="spin"></span> Memuat halaman…</div></div>`;
  syncLock(); icons();
  let d = {};
  try { d = await api('/api/manga/chapter?url=' + encodeURIComponent(url) + (fresh ? '&fresh=1' : '')); } catch (e) { d = {}; }
  if (state.reader.url !== url) return;
  renderReader(d);
}

function renderReader(d) {
  const imgs = d.images || [];
  state.reader.prev = d.prev || null;
  state.reader.next = d.next || null;
  let body;
  if (imgs.length && d.src_ok === false) {
    /* proxy gambar sedang limit -> jangan render puluhan halaman kosong,
       tampilkan satu panel + tombol coba lagi (fresh=true) */
    body = `<div class="rmsg"><i data-lucide="cloud-off" style="width:30px;height:30px"></i>
      <p style="margin:0"><b>Gambar chapter belum bisa diambil.</b></p>
      <p style="margin:0;max-width:430px;line-height:1.5">Host gambar sumber (<code>nhentai.net</code>) sedang menolak koneksi dari server ini — di luar kendali server lokal, biasanya pulih sendiri.</p>
      <button class="btn btn-acc" data-action="reader-go" data-url="${esc(state.reader.url || '')}" data-fresh="1"><i data-lucide="refresh-cw"></i>Coba lagi</button></div>`;
  } else if (imgs.length) {
    body = `<div class="rpages">${imgs.map((u, i) => `<img loading="lazy" src="${esc(u)}" alt="Halaman ${i + 1}" onerror="this.onerror=null;this.src='${rph(i)}'">`).join('')}</div>`;
  } else {
    body = `<div class="rmsg"><i data-lucide="book-open" style="width:26px;height:26px"></i>${esc(d.configured === false ? 'Sumber manga belum dikonfigurasi.' : 'Halaman chapter tidak tersedia.')}</div>`;
  }
  const foot = (d.prev || d.next)
    ? `<div class="rnav">
        ${d.prev ? `<button class="btn" data-action="reader-go" data-url="${esc(d.prev)}"><i data-lucide="chevron-left"></i>Sebelumnya</button>` : ''}
        ${d.next ? `<button class="btn" data-action="reader-go" data-url="${esc(d.next)}">Berikutnya<i data-lucide="chevron-right"></i></button>` : ''}
      </div>` : '';
  $('#readerRoot').innerHTML = `<div class="reader"><div class="rtop">
    <button class="ic" data-action="close-reader" aria-label="Tutup"><i data-lucide="arrow-left"></i></button>
    <span class="rt">${esc(d.label || 'Chapter')}</span>
    <span style="display:flex;gap:6px">
      <button class="ic" data-action="reader-go" data-url="${esc(state.reader.url || '')}" data-fresh="1" aria-label="Muat ulang"><i data-lucide="rotate-cw"></i></button>
      ${d.next ? `<button class="ic" data-action="reader-go" data-url="${esc(d.next)}" aria-label="Chapter berikutnya"><i data-lucide="chevron-right"></i></button>` : ''}
    </span>
  </div>${body}${foot}</div>`;
  icons();
}

function closeReader() { state.reader = { url: null, prev: null, next: null }; $('#readerRoot').innerHTML = ''; syncLock(); }

/* ----------------------------------------------------------------
   ROUTER & AKSI
   ---------------------------------------------------------------- */
function go(view) {
  state.view = view; stopHero();
  $$('.view').forEach(s => s.classList.toggle('show', s.id === 'view-' + view));
  if (view === 'home') renderHome();
  else if (view === 'browse') renderBrowse();
  else if (view === 'list') renderList();
  else if (view === 'manga') renderManga();
  window.scrollTo({ top: 0 });
  $$('.hnav [data-view], .bnav [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
}

async function toggleList(id) {
  const a = state.anime.get(id) || {};
  const had = state.favs.has(id);
  if (had) state.favs.delete(id); else state.favs.add(id);
  updateBadges();
  let ok = true;
  try {
    const r = await localApi('/api/favorites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: id, title: a.title || '', thumb: a.thumb || '' }) });
    if (r && typeof r.is_fav === 'boolean') { r.is_fav ? state.favs.add(id) : state.favs.delete(id); }
  } catch (e) { had ? state.favs.add(id) : state.favs.delete(id); ok = false; }
  if (!ok) { toast('Gagal menyimpan', 'x'); updateBadges(); return; }

  const now = state.favs.has(id);
  toast(now ? 'Ditambahkan ke Daftar Saya' : 'Dihapus dari Daftar Saya', now ? 'bookmark-check' : 'bookmark');
  $$('[data-action="toggle-list"]').forEach(b => {
    if (b.dataset.id !== id) return;
    const bml = b.querySelector('.bml');
    b.classList.toggle('on', now); b.classList.toggle('btn-on', now);
    b.innerHTML = `<i data-lucide="${now ? 'bookmark-check' : 'bookmark'}"></i>` + (bml ? `<span class="bml">${now ? 'Di Daftarku' : 'Daftarku'}</span>` : '');
  });
  icons(); updateBadges();
  if (state.view === 'list') renderList();
}

const railScroll = (id, dir) => { const r = $('#' + id); if (r) r.scrollBy({ left: r.clientWidth * 0.8 * dir, behavior: 'smooth' }); };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const id = t.dataset.id || '';
  switch (t.dataset.action) {
    case 'nav': go(t.dataset.view); break;
    case 'open-search': openSearch(); break;
    case 'close-search': closeSearch(); break;
    case 's-open': closeSearch(); openModal(id); break;
    case 'open-detail': openModal(id); break;
    case 'close-modal': closeModal(); break;
    case 'close-modal-back': if (e.target.classList.contains('mback')) closeModal(); break;
    case 'toggle-list': toggleList(id); break;
    case 'play': openPlayer(id, +(t.dataset.ep || 1), +(t.dataset.frac || 0), t.dataset.eurl || ''); break;
    case 'hero-seg': heroGo(+t.dataset.i); startHero(); break;
    case 'rail-l': railScroll(t.dataset.t, -1); break;
    case 'rail-r': railScroll(t.dataset.t, 1); break;
    case 'genre': state.genre.slug = t.dataset.slug || ''; state.genre.name = t.dataset.g || 'Semua';
      $$('#bChips .chip').forEach(c => c.classList.toggle('on', c === t));
      state.browse.items = []; loadBrowse(1); break;
    case 'loadmore': loadBrowse(state.browse.page + 1); break;
    case 'qset': state.player.srv = null; state.player.q = t.dataset.q; loadEpisode(state.player.eurl, state.player.epnum); break;
    case 'close-player': closePlayer(); break;
    case 'player-next': nextEp(); break;
    case 'open-manga': openManga(id); break;
    case 'close-manga': closeManga(); break;
    case 'close-manga-back': if (e.target.classList.contains('mback')) closeManga(); break;
    case 'open-chapter': openChapter(t.dataset.url); break;
    case 'close-reader': closeReader(); break;
    case 'reader-go': openChapter(t.dataset.url, t.dataset.fresh === '1'); break;
    case 'mgenre': state.manga.genre = t.dataset.slug || '';
      $$('#mGenres .chip').forEach(c => c.classList.toggle('on', c === t));
      loadManga(1, ($('#mIn') && $('#mIn').value.trim()) || ''); break;
    case 'mloadmore': loadManga(state.manga.page + 1, ($('#mIn') && $('#mIn').value.trim()) || ''); break;
    case 'reload-home': renderHome(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.reader.url) closeReader();
  else if (state.mangaId) closeManga();
  else if (state.player.open) closePlayer();
  else if (state.modalId) closeModal();
  else if (state.searchOpen) closeSearch();
});
const _prog = $('#prog i');
const onScroll = () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  if (_prog) _prog.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  $('#hdr').classList.toggle('sc', scrollY > 10);
};
addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* ----------------------------------------------------------------
   INIT
   ---------------------------------------------------------------- */
updateBadges();
(async () => {
  try { const d = await localApi('/api/favorites'); state.favs = new Set((d.items || []).map(i => i.url)); } catch (e) {}
  updateBadges();
})();
go('home');
icons();

</script>
</body>
</html>
