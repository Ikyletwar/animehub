<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f8cff">
<title>AnimeHub — Otakudesu Realtime</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#1a2130; --line:#222c3d;
    --txt:#e6edf6; --dim:#8b98ad; --acc:#4f8cff; --acc2:#7c5cff;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --pad:12px; --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  button{font-family:inherit}

  /* ============ HEADER ============ */
  header{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.95);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 var(--pad)}
  .top{display:flex;align-items:center;gap:9px;height:52px}
  .logo{font-weight:800;font-size:17px;letter-spacing:.4px;
        background:linear-gradient(90deg,var(--acc),var(--acc2));
        -webkit-background-clip:text;background-clip:text;color:transparent;
        white-space:nowrap}
  .ver{background:#2b1a4d;color:#c4b5fd;border:1px solid #4c3a7a;
       font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;
       font-family:ui-monospace,Menlo,monospace}

  /* ============ IKON: semua SVG, tanpa emoji ============ */
  .ic{width:18px;height:18px;flex:0 0 auto;display:block;
      fill:none;stroke:currentColor;stroke-width:1.9;
      stroke-linecap:round;stroke-linejoin:round}
  .ic.fill{fill:currentColor;stroke:none}

  /* ============ NAV DESKTOP (>=900px) ============ */
  #nav{display:none}
  #nav button{display:inline-flex;align-items:center;gap:7px;background:none;
       border:0;color:var(--dim);padding:8px 11px;border-radius:8px;
       cursor:pointer;font-weight:600;white-space:nowrap;font-size:13px}
  #nav button:hover{color:var(--txt);background:var(--panel2)}
  #nav button.on{color:var(--txt);background:var(--panel2)}
  #nav .cnt{background:var(--acc);color:#fff;border-radius:999px;
       font-size:10px;padding:1px 5px;font-weight:700}

  /* Tombol hamburger: hanya <900px. */
  .hbtn{display:flex;align-items:center;justify-content:center;margin-left:auto;
        width:38px;height:38px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;color:var(--txt);cursor:pointer}
  .hbtn:active{transform:scale(.96)}

  @media(min-width:900px){
    #nav{display:flex;gap:3px;margin-left:auto}
    .hbtn{display:none}
    .drawer{display:none}
  }

  /* ============ DRAWER (menu mobile) ============ */
  .drawer{position:fixed;inset:0;z-index:45;visibility:hidden;pointer-events:none}
  .drawer.on{visibility:visible;pointer-events:auto}
  .dscrim{position:absolute;inset:0;background:rgba(0,0,0,.6);
          opacity:0;transition:opacity .22s}
  .drawer.on .dscrim{opacity:1}
  .dpanel{position:absolute;top:0;right:0;bottom:0;width:min(78vw,300px);
       background:var(--panel);border-left:1px solid var(--line);
       padding:10px;padding-top:calc(10px + env(safe-area-inset-top));
       padding-bottom:calc(14px + env(safe-area-inset-bottom));
       display:flex;flex-direction:column;gap:4px;overflow-y:auto;
       transform:translateX(100%);transition:transform .22s ease;
       box-shadow:-14px 0 34px #0009}
  .drawer.on .dpanel{transform:none}
  .dhead{display:flex;align-items:center;margin:2px 4px 8px}
  .dhead .logo{font-size:16px}
  .dpanel>button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
       background:none;border:0;color:var(--dim);padding:12px;border-radius:10px;
       font-size:14px;font-weight:600;cursor:pointer}
  .dpanel>button:hover{background:var(--panel2);color:var(--txt)}
  .dpanel>button.on{background:var(--panel2);color:var(--acc)}
  .dpanel .cnt{margin-left:auto;background:var(--acc);color:#fff;border-radius:999px;
       font-size:10px;padding:1px 6px;font-weight:800}

  .searchbox{display:flex;gap:7px;margin:9px 0 11px}
  .searchbox input{flex:1;min-width:0;background:var(--panel);
        border:1px solid var(--line);color:var(--txt);padding:10px 12px;
        border-radius:11px;outline:0;font-size:16px} /* 16px cegah iOS zoom */
  .searchbox input:focus{border-color:var(--acc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
       background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;
       border:0;padding:10px 15px;border-radius:11px;cursor:pointer;font-weight:700}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}

  .bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 0 10px}
  .bar h2{margin:0;font-size:15px;color:var(--txt);flex:1;min-width:0;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{background:var(--panel);border:1px solid var(--line);color:var(--dim);
        padding:2px 8px;border-radius:999px;font-size:11px;white-space:nowrap}
  .pill.live{color:var(--ok);border-color:#1e3a2a}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
       background:var(--ok);margin-right:4px;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ============ GRID: mobile-first, padat ============
     Sumber hanya menyediakan gambar max 225px. Kartu sengaja dibuat
     <=225px agar tidak upscale (= blur). 3 kolom di HP, makin lebar
     makin banyak kolom tapi kartu tetap ramping. */
  .grid{display:grid;gap:9px;padding-bottom:18px;
        grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(min-width:480px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}}
  @media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:13px}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        overflow:hidden;cursor:pointer;position:relative;
        transition:transform .12s ease,border-color .12s}
  .card:active{transform:scale(.975)}
  .card .tw{position:relative;width:100%;aspect-ratio:225/319;
            background:var(--panel2);overflow:hidden}
  .card img{width:100%;height:100%;object-fit:cover;display:block;
            opacity:0;transition:opacity .3s}
  .card img.ready{opacity:1}
  .card img[data-failed="1"]{display:none}
  /* shimmer skeleton */
  .card .tw::after{content:"";position:absolute;inset:0;
        background:linear-gradient(100deg,transparent 20%,#ffffff12 40%,
        transparent 60%);background-size:220% 100%;
        animation:shim 1.3s infinite;pointer-events:none}
  .card .tw.loaded::after{display:none}
  @keyframes shim{0%{background-position:180% 0}100%{background-position:-60% 0}}
  .card .ph{position:absolute;inset:0;display:flex;align-items:center;
           justify-content:center;font-size:26px;font-weight:800;
           color:var(--line)}
  .card .ph .ic{width:26px;height:26px;color:var(--dim)}
  .card .m{padding:6px 7px 7px;min-height:44px}
  .card .t{font-size:11.5px;font-weight:600;line-height:1.25;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
           overflow:hidden;overflow-wrap:anywhere;word-break:break-word;
           min-height:2.5em}
  .card .s{font-size:10px;color:var(--dim);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .s .ic{display:inline-block;width:9px;height:9px;vertical-align:-1px;
               color:var(--warn)}
  .card .sched{color:#7dd3fc}
  .card .fav{position:absolute;top:5px;right:5px;z-index:3;
            background:rgba(0,0,0,.55);border-radius:7px;width:26px;height:26px;
            display:flex;align-items:center;justify-content:center;cursor:pointer;
            opacity:0;transition:.12s}
  .card .fav .ic{width:15px;height:15px}
  .card:hover .fav,.card .fav.act{opacity:1}
  .card .fav.act{color:var(--warn)}
  .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#000a}
  .prog i{display:block;height:100%;
          background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .badge-res{position:absolute;top:5px;left:5px;z-index:3;font-size:9px;
             background:rgba(0,0,0,.7);color:#9fe8b0;padding:1px 5px;
             border-radius:5px;font-weight:800}

  .pager{display:flex;gap:7px;justify-content:center;align-items:center;
         padding:0 0 22px;color:var(--dim);flex-wrap:wrap}
  .sec{margin:0 0 20px}
  .sec h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .sec h3 .ln{flex:1;height:1px;background:var(--line)}

  .chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:14px;
         overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
        padding:6px 11px;border-radius:999px;cursor:pointer;font-size:12px;
        font-weight:600;white-space:nowrap;flex:0 0 auto}
  .chip.on{background:linear-gradient(90deg,var(--acc),var(--acc2));
           color:#fff;border-color:transparent}

  /* ============ MODAL: fullscreen di HP ============ */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
         display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  .modal.on{display:block}
  .modal .box{max-width:940px;margin:0 auto;background:var(--panel);
              border:1px solid var(--line);border-radius:0;
              min-height:100%;padding-bottom:env(safe-area-inset-bottom)}
  @media(min-width:700px){
    .modal .box{margin:20px auto;border-radius:14px;min-height:0;
                max-height:calc(100vh - 40px);overflow:auto}
  }
  .mhead{display:flex;gap:11px;padding:12px;align-items:flex-start}
  .mhead img{width:84px;border-radius:9px;aspect-ratio:225/319;
             object-fit:cover;flex:0 0 auto}
  .mhead h3{margin:0 0 5px;font-size:16px;line-height:1.25}
  .mhead .meta{color:var(--dim);font-size:11.5px;line-height:1.6}
  .mhead .meta b{color:var(--txt)}
  .syn{padding:0 12px 10px;color:var(--dim);font-size:12.5px}
  .eps{max-height:42vh;overflow:auto;border-top:1px solid var(--line);padding:6px;
       -webkit-overflow-scrolling:touch}
  .eps a{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;
         border-radius:7px;font-size:12.5px;cursor:pointer}
  .eps a:active{background:var(--panel2)}
  .eps .lbl,.batch .lbl{display:inline-flex;align-items:center;gap:6px;min-width:0;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eps .lbl .ic,.batch .lbl .ic{width:13px;height:13px;color:var(--dim)}
  .eps .d{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);
     color:var(--txt);width:32px;height:32px;border-radius:9px;cursor:pointer;
     display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mact{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .mact .btn{padding:7px 12px;font-size:12px}
  .mact .btn .ic{width:14px;height:14px}
  .batch{border-top:1px solid var(--line);padding:5px 7px 10px;display:none}
  .batch:has(a){display:block}
  .batch .bhead{font-size:10px;color:var(--dim);text-transform:uppercase;
                letter-spacing:.5px;padding:7px 8px 3px}
  .batch a{display:flex;justify-content:space-between;gap:8px;padding:8px;
           border-radius:7px;font-size:12px;color:#7dd3fc}
  .dlq{padding:10px 12px;border-bottom:1px solid var(--line)}
  .dlq .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .dlq .ql{font-weight:800;font-size:12px;min-width:38px}
  .dlq a,.dbtn{background:#1d2534;border:1px solid var(--line);color:#a5b4c8;
        padding:5px 9px;border-radius:6px;font-size:11px;text-decoration:none;
        cursor:pointer}

  /* ============ PLAYER ============ */
  .player{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;
          z-index:60;display:none;overflow:hidden}
  .player.on{display:flex;flex-direction:column}
  .player video{width:100%;height:100%;flex:1 1 auto;min-height:0;
                background:#000;display:block}
  .player .qbar,.player .pbar{flex:0 0 auto}
  .qbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;
        padding:7px 10px;background:var(--panel2);border-top:1px solid var(--line);
        max-height:23vh;overflow-y:auto}
  .qbar .lab{font-size:10px;color:var(--dim);text-transform:uppercase;
            letter-spacing:.4px}
  .qbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);
        padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11.5px;
        font-weight:700;flex:0 0 auto}
  .qbtn.on{background:linear-gradient(90deg,var(--acc),var(--acc2));
           border-color:transparent;color:#fff}
  .qbtn small{font-weight:600;opacity:.65;font-size:9.5px;margin-left:3px}
  .sbtn{background:#1d2534;border:1px solid var(--line);color:var(--dim);
        padding:4px 8px;border-radius:6px;cursor:pointer;font-size:10.5px;
        display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
  .sbtn.on{color:#7dd3fc;border-color:#1e3a4a}
  .sbtn .led{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .sbtn .led.ok{background:var(--ok)}
  .sbtn .led.bad{background:var(--bad)}
  .pbar{display:flex;align-items:center;gap:8px;padding:8px 10px;
        background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
  .pbar .t{font-size:12px;font-weight:600;flex:1;min-width:0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbar .u{font-size:10px;color:var(--dim);flex-basis:100%;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:40px 0;text-align:center;color:var(--dim);font-size:13px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
        border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .diag{font-size:9px;color:#64748b;font-family:ui-monospace,Menlo,monospace;
        width:100%;order:9}
  .diag b{color:#94a3b8}
  .nextup{display:none}
  @media(min-width:700px){
    .nextup{display:flex;gap:9px;align-items:center;background:var(--panel);
      border:1px solid var(--line);border-radius:8px;padding:6px 9px;
      font-size:11.5px;max-width:300px;cursor:pointer}
    .nextup img{width:34px;border-radius:4px}
    .nextup .nx{color:var(--dim);font-size:9px;text-transform:uppercase}
  }
  .stats{display:grid;gap:8px;padding-bottom:18px;
         grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(min-width:600px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:900px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:11px}
  .stat .v{font-size:20px;font-weight:800;
           background:linear-gradient(90deg,var(--acc),var(--acc2));
           -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .k{font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:1px}
  .schedgrid{display:grid;gap:9px;padding-bottom:20px;
             grid-template-columns:minmax(0,1fr)}
  @media(min-width:600px){.schedgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:960px){.schedgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:10px}
  .day h4{margin:0 0 6px;font-size:12.5px;color:var(--acc)}
  .day .it{font-size:11.5px;color:var(--dim);padding:4px 0;cursor:pointer;
           border-bottom:1px solid var(--line);overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;
         display:none;align-items:center;justify-content:center;padding:16px}
  .scrim.on{display:flex}
  .scrim .box{background:var(--panel);border:1px solid var(--line);
              border-radius:14px;padding:18px 20px;max-width:400px;width:100%}
  .scrim h3{margin:0 0 12px;font-size:15px}
  .scrim table{width:100%;font-size:12.5px;border-collapse:collapse}
  .scrim td{padding:4px 0;color:var(--dim)}
  .scrim td:first-child{width:96px}
  .scrim kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
             padding:2px 6px;font-size:10.5px;color:var(--txt);
             font-family:ui-monospace,monospace}
  .toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
         transform:translateX(-50%);background:var(--panel2);
         border:1px solid var(--acc);color:var(--txt);padding:9px 16px;
         border-radius:10px;z-index:90;font-size:12.5px;
         opacity:0;pointer-events:none;transition:.22s}
  .toast.on{opacity:1}
</style>
</head>
<body>

<!-- Sprite ikon SVG — didefinisikan sekali, dipakai berkali-kali via <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c2 2.6 4 5 4 8.5a4 4 0 0 1-8 0c0-1 .3-1.8.7-2.5-1.1.9-2.7 2.6-2.7 5a6 6 0 0 0 12 0c0-4.2-3.5-8.4-6-11z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 11.5V4a1 1 0 0 1 1-1h7.5a1 1 0 0 1 .7.3l8.5 8.5a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 12.2a1 1 0 0 1-.3-.7z"/><circle cx="7.5" cy="7.5" r="1.3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2.5 20h19"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 21h16"/></symbol>

    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </defs>
</svg>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">ANIMEHUB</div>
      <span class="ver" id="ver">v?</span>
      <nav id="nav" class="dnav">
        <button class="on" data-tab="home"><svg class="ic"><use href="#i-home"/></svg>Home</button>
        <button data-tab="ongoing"><svg class="ic"><use href="#i-fire"/></svg>On-Going</button>
        <button data-tab="search"><svg class="ic"><use href="#i-search"/></svg>Search</button>
        <button data-tab="list"><svg class="ic"><use href="#i-list"/></svg>List Anime</button>
        <button data-tab="genre"><svg class="ic"><use href="#i-tag"/></svg>Genre</button>
        <button data-tab="fav"><svg class="ic"><use href="#i-star"/></svg>Favorit<span class="cnt" id="favcnt" hidden>0</span></button>
        <button data-tab="stats"><svg class="ic"><use href="#i-chart"/></svg>Statistik</button>
      </nav>
      <button class="hbtn" id="hbtn" aria-label="Buka menu" aria-expanded="false"
              aria-controls="drawer" onclick="toggleMenu()">

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu">

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (u) => (await fetch(u)).json();

let TAB="home", PAGE=1, MAXP=1, CUR_GENRE=null, FAVS=new Set();
/* Render token: mencegah respons lambat menimpa konten tab yang lebih baru.
   Tanpa ini, klik tab cepat = konten tertinggal satu langkah. */
let RENDER_TOK=0;
function tok(){ return ++RENDER_TOK; }
function stale(t){ return t!==RENDER_TOK; }
let CUR_EP=null, CUR_OPTS=[], CUR_Q="360p", CUR_I=null, RES={};
let CUR_ANIME=null, EP_LIST=[], EP_IDX=-1, AUTO_NEXT=true, MIRROR_OK={};

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2000); }

/* ============ CARD + THUMBNAIL LAZY ============ */
const thumbObs = new IntersectionObserver(es=>{
  for(const e of es){
    if(!e.isIntersecting) continue;
    const img=e.target; if(!img.dataset.thumb) continue;
    const u=img.dataset.thumb; delete img.dataset.thumb;
    thumbObs.unobserve(img);
    img.onload=()=>imgOK(img);
    api("/api/thumb?url="+encodeURIComponent(u))
       .then(j=>{
         if(!j.thumb){ thumbFail(img); return; }
         if(j.srcset){
           img.setAttribute("srcset", j.srcset);
           img.setAttribute("sizes",
             "(max-width:480px) 33vw,(max-width:700px) 25vw,(max-width:900px) 20vw,(max-width:1200px) 16vw,12vw");
         }
         img.src=j.thumb;
       })
       .catch(()=>thumbFail(img));
  }
},{rootMargin:"220px"});
const observeThumbs=()=>$$("img[data-thumb]").forEach(i=>thumbObs.observe(i));
const thumbFail=img=>{ img.dataset.failed="1";
  const w=img.parentElement; if(w) w.classList.add("loaded"); };
function imgOK(img){
  img.classList.add("ready");
  const w=img.parentElement;
  if(w){ w.classList.add("loaded");
    const ph=w.querySelector(".ph"); if(ph) ph.style.display="none"; }
}
function phHide(img){ imgOK(img); }

function card(a,opts={}){
  const alt = a.thumb ? esc(a.thumb) : "";
  const ss  = a.srcset ? ` srcset="${esc(a.srcset)}" sizes="(max-width:480px) 33vw,(max-width:700px) 25vw,(max-width:900px) 20vw,(max-width:1200px) 16vw,12vw"` : "";
  const fav = FAVS.has(a.url);
  const pct = opts.percent||0;
  const inner = a.thumb
    ? `<img loading="lazy" decoding="async" src="${alt}"${ss}
             onload="imgOK(this)" onerror="thumbFail(this)">`
    : `<img loading="lazy" decoding="async" data-thumb="${esc(a.url)}"
             onload="imgOK(this)" onerror="thumbFail(this)">`;
  return `<div class="card" onclick="openDetail('${esc(a.url)}')">
    ${opts.res?`<span class="badge-res">${esc(opts.res)}</span>`:""}
    <button class="fav ${fav?'act':''}" aria-label="favorit"
      onclick="event.stopPropagation();toggleFav('${esc(a.url)}')">${starIcon(fav)}</button>
    <div class="tw">${inner}<span class="ph">${esc((a.title||"?").trim().charAt(0).toUpperCase())}</span>
      ${pct?`<div class="prog"><i style="width:${pct}%"></i></div>`:""}</div>
    <div class="m"><div class="t">${esc(a.title)}</div>
      ${a.sched?`<div class="s sched">${esc(a.sched)}</div>`:""}
      ${a.status?`<div class="s">${esc(a.status)}${a.score?` <svg class="ic"><use href="#i-star"/></svg>${esc(a.score)}`:""}</div>`:""}
    </div></div>`;
}

/* Ikon bintang: outline saat belum favorit, terisi saat favorit. */
function starIcon(on){
  return `<svg class="ic ${on?'fill':''}"><use href="#i-star"/></svg>`;
}

function setTitle(t){ $("#title").textContent=t; }
/* Bungkus kartu dalam .grid — tanpa ini kartu jadi full-width (besar) */
function G(cards){ return `<div class="grid">${cards}</div>`; }
function show(h){ $("#content").innerHTML=h; observeThumbs(); }
/* showIf: hanya menulis DOM bila token masih yang terbaru */
function showIf(t,h){ if(stale(t)) return false; show(h); return true; }
function loading(){ show(`<div class="empty"><span class="spin"></span></div>`); }
function setCount(n){ $("#count").textContent = n==null?$("#count").textContent:n+" item"; }

/* ============ TABS ============ */
const TABS={
  async home(){
    const t=tok();
    $("#chips").style.display="none";
    setTitle("Beranda"); loading();
    const [cont,ong,sch] = await Promise.all([
      api("/api/continue"), api("/api/ongoing"), api("/api/schedule")]);
    if(stale(t)) return;
    let h="";
    if(cont.items && cont.items.length){
      h+=`<div class="sec"><h3>Lanjut Nonton <span class="ln"></span></h3>
        <div class="grid">${cont.items.map(x=>`
          <div class="card" onclick="play('${esc(x.episode_url)}','${esc(x.anime_title)}')">
            <div class="tw">
              <img loading="lazy" decoding="async" src="${esc(x.thumb||'')}"
                   onload="imgOK(this)" onerror="thumbFail(this)">
              <span class="ph"><svg class="ic fill" style="width:26px;height:26px"><use href="#i-play"/></svg></span>
              <div class="prog"><i style="width:${x.percent}%"></i></div></div>
            <div class="m"><div class="t">${esc(x.ep_title||x.anime_title)}</div>
            <div class="s">${Math.round(x.position)}s / ${esc(x.anime_title)}</div></div></div>`).join("")}</div></div>`;
    }
    h+=`<div class="sec"><h3>On-Going Terbaru <span class="ln"></span></h3>
      <div class="grid">${ong.items.slice(0,18).map(a=>card(a)).join("")}</div></div>`;
    if(sch.schedule && sch.schedule.length){
      h+=`<div class="sec"><h3>Jadwal Rilis <span class="ln"></span></h3>
        <div class="schedgrid">${sch.schedule.map(d=>`
          <div class="day"><h4>${esc(d.day)}</h4>
          ${d.items.slice(0,6).map(i=>`<div class="it" onclick="openDetail('${esc(i.url)}')">${esc(i.title)}</div>`).join("")}
          ${d.items.length>6?`<div class="it" style="color:var(--dim);cursor:default">+${d.items.length-6} lainnya</div>`:""}
          </div>`).join("")}</div></div>`;
    }
    showIf(t,h);
    setCount(ong.items.length);
  },

  async ongoing(){
    const t=tok();
    $("#chips").style.display="none";
    setTitle("On-Going Anime"); loading();
    const d=await api("/api/ongoing");
    if(stale(t)) return;
    show(d.items.length ? G(d.items.map(a=>card(a)).join(""))
                        : `<div class="empty">Tidak ada data.</div>`);
    setCount(d.items.length);
  },

  async search(){
    const t=tok();
    $("#chips").style.display="none";
    const q=$("#q").value.trim();
    if(!q){ setTitle("Search"); show(`<div class="empty">Ketik judul anime di atas.</div>`); return; }
    setTitle(`Hasil: "${q}"`); loading();
    const d=await api("/api/search?q="+encodeURIComponent(q));
    if(stale(t)) return;
    if(!d.results.length){ show(`<div class="empty">Tidak ada hasil untuk "${esc(q)}".</div>`); return; }
    show(G(d.results.map(a=>card(a)).join("")));
    setCount(d.results.length + (d.source==="local"?" (pencarian lokal)":""));
  },

  async list(p){
    const t=tok();
    $("#chips").style.display="none";
    PAGE=p||1;
    const q=$("#q").value.trim();
    setTitle("List Anime"+(q?` — "${q}"`:"")); loading();
    const d=await api(`/api/list?page=${PAGE}&q=${encodeURIComponent(q)}`);
    if(stale(t)) return;
    MAXP=d.max_page;
    show(d.items.length ? G(d.items.map(a=>card(a)).join(""))
                        : `<div class="empty">Tidak ada hasil.</div>`);
    setCount(`${d.total} anime`);
    $("#pager").innerHTML = d.max_page>1 ?
      `<button class="btn ghost" ${PAGE<=1?"disabled":""} aria-label="Sebelumnya" onclick="TABS.list(${PAGE-1})"><svg class="ic"><use href="#i-left"/></svg></button>
       <span>Hal ${d.page} / ${d.max_page} · total ${d.total}</span>
       <button class="btn ghost" ${PAGE>=d.max_page?"disabled":""} aria-label="Berikutnya" onclick="TABS.list(${PAGE+1})"><svg class="ic"><use href="#i-right"/></svg></button>` : "";
  },

  async genre(slug){
    const t=tok();
    loading();
    const d=await api("/api/genres");
    if(stale(t)) return;
    $("#chips").style.display="flex";
    if(!slug){
      setTitle("Genre");
      $("#chips").innerHTML="";
      show(d.genres.map(g=>`<div class="chip" onclick="TABS.genre('${g.slug}')">${esc(g.name)}</div>`).join(""));
      $("#pager").innerHTML="";
      setCount(d.genres.length);
      return;
    }
    CUR_GENRE=slug;
    const gn=d.genres.find(g=>g.slug===slug);
    setTitle(`Genre: ${gn?gn.name:slug}`);
    $("#chips").innerHTML = `<div class="chip" onclick="TABS.genre()">Semua genre</div>` +
      d.genres.map(g=>`<div class="chip ${g.slug===slug?"on":""}" onclick="TABS.genre('${g.slug}')">${esc(g.name)}</div>`).join("");
    const r=await api("/api/genre?slug="+slug);
    if(stale(t)) return;
    show(r.items.length ? G(r.items.map(a=>card(a)).join(""))
                        : `<div class="empty">Kosong.</div>`);
    setCount(r.items.length);
    $("#pager").innerHTML="";
  },

  async fav(){
    const t=tok();
    $("#chips").style.display="none";
    setTitle("Favorit"); loading();
    const d=await api("/api/favorites");
    if(stale(t)) return;
    FAVS=new Set(d.items.map(x=>x.url));
    show(d.items.length ? G(d.items.map(a=>card({url:a.url,title:a.title,thumb:a.thumb})).join(""))
      : `<div class="empty">Belum ada favorit. Klik ikon bintang pada kartu anime.</div>`);
    setCount(d.items.length);
  },

  async stats(){
    const t=tok();
    $("#chips").style.display="none";
    setTitle("Statistik"); loading();
    const s=await api("/api/stats");
    if(stale(t)) return;
    const a=s.source||{}, l=s.local||{};
    show(`
      <div class="stats">
        <div class="stat"><div class="v">${a.total_anime||0}</div><div class="k">Total Anime</div></div>
        <div class="stat"><div class="v">${a.total_ongoing||0}</div><div class="k">On-Going</div></div>
        <div class="stat"><div class="v">${a.total_genres||0}</div><div class="k">Genre</div></div>
        <div class="stat"><div class="v">${l.anime_cached||0}</div><div class="k">Cache Lokal</div></div>
        <div class="stat"><div class="v">${l.with_thumb||0}</div><div class="k">Ada Cover</div></div>
        <div class="stat"><div class="v">${l.favorites||0}</div><div class="k">Favorit</div></div>
        <div class="stat"><div class="v">${l.in_progress||0}</div><div class="k">Sedang Ditonton</div></div>
        <div class="stat"><div class="v">${l.episodes_watched||0}</div><div class="k">Episode Ditonton</div></div>
        <div class="stat"><div class="v">${l.db_size_kb||0}</div><div class="k">DB (KB)</div></div>
      </div>
      <div class="sec" id="topsec"><h3>Paling Banyak Episode
        <span class="ln"></span></h3>
        <div style="color:var(--dim);font-size:12px">
          <span class="spin"></span> menyiapkan data…</div></div>`);
    setCount(l.anime_cached || 0); $("#pager").innerHTML="";
    loadTop(t);           // dimuat terpisah, tetap dijaga tokennya
  }
};

async function loadTop(t){
  let items=[];
  try{
    const r=await api("/api/top");
    items=r.items||[];
  }catch(e){}
  if(t && stale(t)) return;
  const el=$("#topsec");
  if(!el || !document.getElementById('topsec')) return;
  if(items.length){
    el.innerHTML=`<h3>Paling Banyak Episode <span class="ln"></span></h3>
      ${G(items.map(t=>card(t,{res:t.total_ep?t.total_ep+" ep":""})).join(""))}`;
    observeThumbs();
  }else{
    el.innerHTML=`<h3>Paling Banyak Episode <span class="ln"></span></h3>
      <div style="color:var(--dim);font-size:12px">
        Data sedang disiapkan di server — buka tab ini lagi sebentar lagi.</div>`;
  }
}

function doSearch(){ if(TAB==="list"){TABS.list(1);} else {TAB="search"; markNav("search"); TABS.search();} }

function markNav(t){
  $$("#nav button, .drawer button[data-tab]").forEach(b=>
    b.classList.toggle("on", b.dataset.tab===t));
}

/* Menu mobile: drawer geser dari kanan. Desktop pakai #nav horizontal. */
function toggleMenu(on){
  const d=$("#drawer"), hb=$("#hbtn");
  const v = (on===undefined) ? !d.classList.contains("on") : !!on;
  d.classList.toggle("on", v);
  if(hb) hb.setAttribute("aria-expanded", v?"true":"false");
  if(v){ const first=d.querySelector(".dpanel button[data-tab]"); first&&first.focus({preventScroll:true}); }
}

function switchTab(t){
  RENDER_TOK++;          /* batalkan render tab sebelumnya */
  markNav(t); TAB=t; toggleMenu(false);
  (TABS[t]||TABS.home)();
}
$$("#nav button, .drawer button[data-tab]").forEach(b=>{
  b.onclick=()=>switchTab(b.dataset.tab);
});
/* tab "Cari" -> fokus ke kolom pencarian setelah menu tertutup */
$("#nav button[data-tab='search'], .drawer button[data-tab='search']")
  .addEventListener("click",()=>{
    setTimeout(()=>{ $("#q").focus(); },180);
  });

$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(TAB==="list"){ TABS.list(1); }
    else { markNav("search"); TAB="search"; TABS.search(); }
  }
});

/* ============ FAVORIT ============ */
function syncFavCnt(){
  ["#favcnt","#favcnt2"].forEach(sel=>{
    const c=$(sel); if(!c) return;
    c.textContent=FAVS.size; c.hidden=FAVS.size===0;
  });
}

async function toggleFav(url){
  let title="",thumb="";
  if(!url){ url=CUR_ANIME&&CUR_ANIME.url; title=CUR_ANIME.title; thumb=CUR_ANIME.thumb; }
  if(!url) return;
  const r=await fetch("/api/favorites",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url,title,thumb})});
  const j=await r.json();
  if(j.is_fav) FAVS.add(url); else FAVS.delete(url);
  syncFavCnt();
  $$(".fav").forEach(b=>{
    const u=b.getAttribute("onclick").match(/'([^']+)'/)[1];
    const on=FAVS.has(u);
    b.classList.toggle("act",on); b.innerHTML=starIcon(on);
  });
  if($("#m-fav")) $("#m-fav").innerHTML=starIcon(j.is_fav)+" Favorit";
  toast(j.is_fav?"Ditambahkan ke favorit":"Dihapus dari favorit");
}

/* ============ DETAIL ============ */
async function openDetail(url){
  $("#modal").classList.add("on");
  $("#m-dl").innerHTML="";
  $("#m-title").textContent="memuat…";
  $("#m-meta").innerHTML=""; $("#m-syn").textContent="";
  $("#m-eps").innerHTML=""; $("#m-batch").innerHTML="";
  const d=await api("/api/detail?url="+encodeURIComponent(url));
  if(d.error){ $("#m-title").textContent="Gagal memuat"; return; }
  const a=d.anime; CUR_ANIME=a;
  FAVS.has(url)&&FAVS.add(url);
  $("#m-img").src=a.thumb||"";
  $("#m-title").textContent=a.title;
  $("#m-syn").textContent=a.synopsis||"";
  $("#m-meta").innerHTML=[["Status",a.status],["Tipe",a.typ],["Total Episode",a.total_ep],
    ["Skor",a.score],["Studio",a.studio],["Genre",(a.genres||[]).join(", ")]]
    .filter(r=>r[1]&&r[1]!=="?").map(r=>`<b>${esc(r[0])}:</b> ${esc(r[1])}`).join("<br>");
  $("#m-fav").innerHTML = starIcon(d.is_fav)+" Favorit";
  $("#m-resume").style.display = d.progress?"":"none";

  EP_LIST=(d.episodes||[]).filter(e=>!/\/batch\//.test(e.url));
  EP_IDX=-1;
  $("#m-eps").innerHTML = EP_LIST.map((e,i)=>
    `<a onclick="playFromList(${i})"><span class="lbl"><svg class="ic"><use href="#i-play"/></svg>${esc(e.label)}</span>
     <span class="d">${esc(e.date||"")}</span></a>`).join("")
    || "<div class='empty'>Belum ada episode.</div>";
  const bat=(d.batch||[]).concat((d.episodes||[]).filter(e=>/\/batch\//.test(e.url)));
  $("#m-batch").innerHTML = bat.length
    ? `<div class="bhead">Download Batch</div>`+bat.map(b=>
      `<a href="${esc(b.url)}" target="_blank" rel="noopener">
        <span class="lbl"><svg class="ic"><use href="#i-download"/></svg>${esc(b.label)}</span><span class="d">${esc(b.date||"")}</span></a>`).join("") : "";
  if(d.progress){
    EP_IDX = EP_LIST.findIndex(e=>e.url===d.progress.episode_url);
  }
}

function closeModal(){ $("#modal").classList.remove("on"); }
function playFromList(i){ EP_IDX=i; play(EP_LIST[i].url, CUR_ANIME&&CUR_ANIME.title); }
function resumeEp(){
  const i=EP_IDX>=0?EP_IDX:0;
  if(EP_LIST[i]) playFromList(i);
}

/* ============ DOWNLOAD MANAGER ============ */
async function openDl(){
  const box=$("#m-dl");
  if(!box.innerHTML){ box.innerHTML=`<div style="color:var(--dim);font-size:12px">Memuat link…</div>`; }
  const ep=EP_LIST[EP_IDX>=0?EP_IDX:0];
  if(!ep){ box.innerHTML=`<div style="color:var(--dim);font-size:12px">Pilih episode dulu.</div>`; return; }
  const d=await api("/api/links?ep="+encodeURIComponent(ep.url));
  const L=d.links||{};
  const keys=Object.keys(L);
  box.innerHTML = keys.length ? keys.map(q=>`
    <div class="row"><span class="ql">${esc(q)}</span>
      ${Object.entries(L[q]).map(([n,u])=>
        `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}
      <button class="dbtn" onclick="copyLinks()">Copy all ${esc(q)}</button>
    </div>`).join("")
    : `<div style="color:var(--dim);font-size:12px">Episode ini tidak punya link download.</div>`;
}
function copyLinks(){
  const links=[...document.querySelectorAll("#m-dl .row")].map(r=>
    r.querySelector(".ql").textContent+" | "+
    [...r.querySelectorAll("a")].map(a=>a.textContent+" : "+a.href).join("\n")).join("\n\n");
  navigator.clipboard.writeText(links)
    .then(()=>toast("Link disalin ke clipboard"))
    .catch(()=>toast("Gagal menyalin"));
}

/* ============ PLAYER ============ */
async function play(url, animeTitle){
  CUR_EP=url;
  $("#player").classList.add("on");
  RES={};
  $("#vid").style.display="block";
  const f0=$("#viframe");
  if(f0){ f0.style.display="none"; f0.src="about:blank"; }
  $("#p-title").textContent="memuat…";
  $("#p-url").textContent=""; $("#p-server").textContent="";
  $("#vid").removeAttribute("src");
  await loadStream(url);
}

async function loadStream(url){
  const qs=new URLSearchParams({ep:url,q:CUR_Q});
  if(CUR_I!==null&&CUR_I!==undefined) qs.set("i",CUR_I);
  const s=await api("/api/stream?"+qs);
  if(s.available&&s.available.length) CUR_OPTS=s.available;
  if(!CUR_OPTS.length) CUR_OPTS=[{quality:CUR_Q,server:0,label:s.server||"?"}];
  renderQbar();
  if(s.error||(!s.embed&&!s.url)){
    $("#p-title").textContent="Tidak bisa diputar";
    $("#p-server").textContent="";
    $("#p-url").textContent=s.error||"Episode ini tidak menyediakan pemutar.";
    return;
  }
  $("#p-title").textContent=(s.meta&&s.meta.title)||"Episode";
  $("#p-server").textContent=s.quality+" · "+(s.server||"?")
    +(s.res?" · "+s.res:"")+(s.iframe_only?" · mode embed":"");
  if(s.res&&s.quality) RES[s.quality]=s.res;

  if(s.url&&s.relay){
    const v=$("#vid"); const t0=Date.now();
    v.onloadedmetadata=()=>{$("#p-url").textContent="start "+((Date.now()-t0)/1000).toFixed(1)+"s";};
    v.src=s.relay; v.play().catch(()=>{});
  }else{
    let ifr=$("#viframe");
    if(!ifr){
      ifr=document.createElement("iframe"); ifr.id="viframe";
      ifr.style.cssText="width:100%;height:100%;flex:1 1 auto;min-height:0;border:0;background:#000";
      ifr.allowFullscreen=true;
      $("#player").insertBefore(ifr,$("#qbar"));
    }
    $("#vid").style.display="none";
    ifr.style.display="block"; ifr.src=s.embed||"about:blank";
  }
  fillDiag(`&nbsp; <b>mode</b> ${s.iframe_only?"EMBED":"RELAY"} &nbsp; <b>err</b> ${esc(s.error||"-")}`);
  renderNext();
  checkMirrors(url);
}

function setQuality(q,i){
  if(i===undefined||i===null) CUR_I=null;
  else CUR_I=i;
  CUR_Q=q;
  $("#vid").pause(); $("#vid").removeAttribute("src");
  loadStream(CUR_EP);
}

function renderQbar(){
  const qs=[...new Set(CUR_OPTS.map(o=>o.quality))].sort((a,b)=>parseInt(a)-parseInt(b));
  const cur=CUR_OPTS.filter(o=>o.quality===CUR_Q);
  let h=`<span class="lab">Quality</span>`;
  for(const q of qs){
    const rl=(RES[q]?` <small>${esc(RES[q])}</small>`:"");
    h+=`<button class="qbtn ${q===CUR_Q?"on":""}" onclick="setQuality('${q}',null)">${q}${rl}</button>`;
  }
  if(cur.length>1){
    h+=`<span class="lab" style="margin-left:10px">Server</span>`;
    for(const o of cur){
      const on=(o.server===CUR_I)||(CUR_I===null&&o===cur[0]);
      const led=MIRROR_OK[o.label];
      h+=`<button class="sbtn ${on?"on":""}" onclick="setQuality('${o.quality}',${o.server})">
            <span class="led ${led==null?"":(led?"ok":"bad")}"></span>${esc(o.label)}</button>`;
    }
  }
  h+=`<div class="diag" id="diag"></div>`;
  $("#qbar").innerHTML=h;
}

/* health check mirror (fitur 9) */
async function checkMirrors(url){
  try{
    const d=await api("/api/mirrors?ep="+encodeURIComponent(url));
    MIRROR_OK={};
    (d.mirrors||[]).forEach(m=>{ MIRROR_OK[m.label]=m.ok; });
    renderQbar(); fillDiag(`&nbsp; <b>mirror</b> ${JSON.stringify(MIRROR_OK)}`);
  }catch(e){}
}

/* next up */
function renderNext(){
  const box=$("#nextup");
  const nx=EP_LIST[EP_IDX+1];
  if(!nx){ box.style.display="none"; return; }
  box.style.display="flex";
  $("#nx-title").textContent=nx.label;
  $("#nx-img").src=(CUR_ANIME&&CUR_ANIME.thumb)||"";
}
function playNext(){
  if(EP_IDX+1<EP_LIST.length){ playFromList(EP_IDX+1); }
}
function toggleAuto(){
  AUTO_NEXT=!AUTO_NEXT;
  $("#p-auto").textContent="Auto-next: "+(AUTO_NEXT?"ON":"OFF");
}

function closePlayer(){
  $("#player").classList.remove("on");
  const f=$("#viframe");
  if(f){ f.style.display="none"; f.src="about:blank"; }
  const v=$("#vid"); v.pause(); v.removeAttribute("src");
  $("#nextup").style.display="none";
}

function fillDiag(extra){
  const el=$("#diag"); if(!el) return;
  const v=$("#vid"), ua=navigator.userAgent;
  const br=/Firefox\/[\d.]+/.exec(ua)?/Firefox\/[\d.]+/.exec(ua)[0]
          :(/Chrome\/[\d.]+/.exec(ua)?"Chrome":"?");
  const qb=$("#qbar"); const r=qb?qb.getBoundingClientRect():null;
  el.innerHTML=`<b>br</b> ${br} &nbsp; <b>qbar</b> top=${r?Math.round(r.top):"-"} h=${r?Math.round(r.height):"-"}`
    +` &nbsp; <b>win</b> ${innerWidth}x${innerHeight}`
    +` &nbsp; <b>vid</b> ${v?getComputedStyle(v).display:"?"}/${v?v.videoWidth+"x"+v.videoHeight:"-"}`
    +` &nbsp; <b>rs</b> ${v?v.readyState:"-"} <b>t</b> ${v?(+v.currentTime.toFixed(1)):0}`+(extra||"");
}

/* ============ FITUR 2: SAVE PROGRESS ============ */
let saveT=null;
const vid=()=>$("#vid");
setInterval(()=>{
  const v=vid();
  if(!v||!CUR_EP||!v.duration) return;
  if(v.paused && v.currentTime<1) return;
  fetch("/api/progress",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({anime_url:CUR_ANIME?CUR_ANIME.url:"",
      episode_url:CUR_EP, position:v.currentTime, duration:v.duration,
      anime_title:CUR_ANIME?CUR_ANIME.title:"",
      ep_title:$("#p-title").textContent,
      thumb:CUR_ANIME?CUR_ANIME.thumb:"", quality:CUR_Q})}).catch(()=>{});
},20000);
window.addEventListener("beforeunload",()=>{
  const v=vid();
  if(v&&CUR_EP&&v.duration) navigator.sendBeacon("/api/progress",
    new Blob([JSON.stringify({anime_url:CUR_ANIME?CUR_ANIME.url:"",episode_url:CUR_EP,
      position:v.currentTime,duration:v.duration})],{type:"application/json"}));
});

/* auto-next saat ended */
vid().addEventListener("ended",()=>{
  if(AUTO_NEXT && EP_IDX+1<EP_LIST.length){ setTimeout(playNext,1200); }
});

/* ============ FITUR 5: KEYBOARD SHORTCUTS ============ */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea") return;
  const v=vid(), inPlayer=$("#player").classList.contains("on");
  switch(e.key){
    case " ": if(inPlayer){ e.preventDefault(); v.paused?v.play():v.pause(); } break;
    case "ArrowLeft": if(inPlayer){ e.preventDefault(); v.currentTime=Math.max(0,v.currentTime-10);} break;
    case "ArrowRight": if(inPlayer){ e.preventDefault(); v.currentTime=Math.min(v.duration||0,v.currentTime+10);} break;
    case "ArrowUp": if(inPlayer){ e.preventDefault(); v.volume=Math.min(1,v.volume+0.05);} break;
    case "ArrowDown": if(inPlayer){ e.preventDefault(); v.volume=Math.max(0,v.volume-0.05);} break;
    case "m": case "M": if(inPlayer) v.muted=!v.muted; break;
    case "f": case "F": if(inPlayer){
        e.preventDefault();
        if(document.fullscreenElement) document.exitFullscreen();
        else $("#player").requestFullscreen().catch(()=>{});
      } break;
    case "n": case "N": if(inPlayer) playNext(); break;
    case "q": case "Q": if(inPlayer) jumpQ(-1); break;
    case "w": case "W": if(inPlayer) jumpQ(1); break;
    case "e": case "E": if(inPlayer) jumpQ(2); break;
    case "d": case "D": if($("#modal").classList.contains("on")) openDl(); break;
    case "?": $("#scrim").classList.add("on"); break;
    case "Escape":
      if($("#drawer").classList.contains("on")) toggleMenu(false);
      else if($("#scrim").classList.contains("on")) $("#scrim").classList.remove("on");
      else if(inPlayer) closePlayer();
      break;
  }
});
function jumpQ(dir){
  const qs=[...new Set(CUR_OPTS.map(o=>o.quality))].sort((a,b)=>parseInt(a)-parseInt(b));
  const map={"360p":0,"480p":1,"720p":2};
  let i=map[CUR_Q]??0;
  i=Math.max(0,Math.min(qs.length-1,i+dir));
  if(qs[i]) setQuality(qs[i],null);
}
